<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45 - Challenge Grid</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        body main section {
            min-width: 440px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        header.mainmenu {
            text-align: center;
        }

        div.grid1 {
            display: grid;
            margin-bottom: 2rem;
            grid-gap: 0.6rem;
            grid-template-areas: "uno dos tres"
                "cuatro dos cinco"
                "seis seis siete";
            justify-content: center;
            overflow: hidden;
        }

        div.grid1 img {
            width: 128px;
            height: 128px;
            object-fit: cover;
            object-position: center 80%;
            display: block;
            border: none;
            margin: 0;
            border: 2px solid;
            border-radius: 4px;
        }

        div.grid1 img.img1 {
            grid-area: uno;
        }

        div.grid1 img.img2 {
            height: calc(128px * 2 + 0.6rem);
            grid-area: dos;
        }

        div.grid1 img.img3 {
            grid-area: tres;
            object-position: right center;
        }

        div.grid1 img.img4 {
            grid-area: cuatro;
        }

        div.grid1 img.img6 {
            grid-area: seis;
            width: calc(128px * 2 + 0.6rem);
        }

        div.grid1 img.img7 {
            grid-area: siete;
        }

        .contenedor-img5 {
            grid-area: cinco;
            width: 128px;
            height: 128px;
            overflow: hidden;
            border-radius: 4px;
            position: relative;
            border: 2px solid;
        }

        .contenedor-img5 img.img5 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            transform: scale(1.50);
            display: block;
            transition: transform 0.3s ease;
        }

        div.grid2 {
            display: grid;
            margin-bottom: 0.2rem;
            grid-gap: 0.6rem;
            grid-template-areas: "uno uno dos tres"
                "uno uno cuatro cuatro"
                "cinco seis cuatro cuatro";
        }

        div.grid2 img {
            border-radius: 4px;
            outline: 2px solid #fff;
            height: 94px;
            object-fit: cover;
            width: 94px;
            object-position: center 80%;
        }


        div.grid2 img.img8 {
            height: calc(94px * 2 + 0.6rem);
            width: calc(94px * 2 + 0.6rem);
            grid-area: uno;

        }

        div.grid2 img.img9 {
            grid-area: dos;
        }

        div.grid2 img.img10 {
            grid-area: tres;
            object-position: right center;
        }

        div.grid2 img.img11 {
            height: calc(94px * 2 + 0.6rem);
            width: calc(94px * 2 + 0.6rem);
            grid-area: cuatro;
        }

        div.grid2 img.img12 {
            grid-area: cinco;
        }

        .contenedor-img12 {
            grid-area: cinco;
            overflow: hidden;
            border-radius: 4px;
            position: relative;
            border: 2px solid;
        }

        .contenedor-img12 img.img12 {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
            transform: scale(1.50);
            display: block;
            transition: transform 0.3s ease;
        }

        div.grid2 img.img13 {
            grid-area: seis;
        }
    </style>
</head>

<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>45 - Challenge Grid</h1>
            <h3>Practical exercise building a dynamic, irregular image gallery layout utilizing CSS Grid spanning
                properties (grid-column, grid-row).</h3>
        </header>
        <section>
            <div class="grid1">
                <img class="img1" src="imgs/grid/grid-01.jpg" alt="01">
                <img class="img2" src="imgs/grid/grid-02.jpg" alt="02">
                <img class="img3" src="imgs/grid/grid-03.jpg" alt="03">
                <img class="img4" src="imgs/grid/grid-04.webp" alt="04">
                <div class="contenedor-img5">
                    <img class="img5" src="imgs/grid/grid-05.jpg" alt="05">
                </div>
                <img class="img6" src="imgs/grid/grid-06.webp" alt="06">
                <img class="img7" src="imgs/grid/grid-07.webp" alt="07">
            </div>
            <div class="grid2">
                <img class="img8" src="imgs/grid/grid-01.jpg" alt="08">
                <img class="img9" src="imgs/grid/grid-02.jpg" alt="09">
                <img class="img10" src="imgs/grid/grid-03.jpg" alt="10">
                <img class="img11" src="imgs/grid/grid-04.webp" alt="11">
                <div class="contenedor-img12">
                    <img class="img12" src="imgs/grid/grid-05.jpg" alt="12">
                </div>
                <img class="img13" src="imgs/grid/grid-06.webp" alt="13">
            </div>

        </section>
    </main>
</body>

</html>
