<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>45 - Challenge Grid</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        body main section {
            min-width: 440px;
        }

        main section div.grid1 img {
            border: none;
            margin: 0;
        }

        div.grid1 {
            display: grid;
            margin-bottom: 2rem;
            grid-gap: 0.6rem;
            grid-template-areas: "one  two three"
                "four two five"
                "six six seven";
            justify-content: center;
            overflow: hidden;
        }

        div.grid1 img {
            border-radius: 4px;
            width: 128px;
            height: 128px;
            object-position: center 80%;
            object-fit: cover;
            display: block;
        }

        div.grid1 img.img01 {
            grid-area: one;
        }

        div.grid1 img.img02 {
            height: calc(128px * 2 + 0.6rem);
            grid-area: two;
        }

        div.grid1 img.img03 {
            grid-area: three;
            object-position: right center;
        }

        div.grid1 img.img04 {
            grid-area: four;
        }

        div.grid1 img.img05 {
            grid-area: five;
        }

        div.grid1 img.img06 {
            grid-area: six;
            width: calc(128px * 2 + 0.6rem);
        }

        div.grid1 img.img07 {
            grid-area: seven;
        }
    </style>
</head>

<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>45 - Challenge Grid</h1>
            <h3>Practical exercise building a dynamic, irregular image gallery layout utilizing CSS Grid spanning
                properties (grid-column, grid-row).</h3>
        </header>
        <section>
            <div class="grid1">
                <img class="img01" src="imgs/grid/grid-01.jpg" alt="01">
                <img class="img02" src="imgs/grid/grid-02.jpg" alt="02">
                <img class="img03" src="imgs/grid/grid-03.jpg" alt="03">
                <img class="img04" src="imgs/grid/gris-04.png" alt="04">
                <img class="img05" src="imgs/grid/gris-05.png" alt="05">
                <img class="img06" src="imgs/grid/grid-06.webp" alt="06">
                <img class="img07" src="imgs/grid/gris-07.png" alt="07">
            </div>
        </section>
    </main>
</body>

</html>
