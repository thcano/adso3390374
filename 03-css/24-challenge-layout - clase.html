<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24 - Challenge (Clase)</title>
    <style>
        body {
            background-color: #17a153;
            border: 10px solid #fff;
            padding: 0;
            margin: 0;
            min-height: 100dvh;

            main {
                border: 10px solid red;
                margin: 2rem auto;
                width: 1024px;

                header {
                    figure.logo {
                        background: url(imgs/spriteweb.png);
                        background-position: -10px -401px;
                        height: 171px;
                        padding: 0;
                        margin: 0 auto;
                        width: 184px;
                    }
                }

                menu {
                    padding: 0;
                    margin: 2rem auto;
                    width: 916px;

                    a:link,
                    a:visited {
                        background-color: #0d522b;
                        border-bottom: 3px solid #fff;
                        color: #fff;
                        display: inline-block;
                        text-align: center;
                        text-decoration: none;
                        padding-top: 20px;
                        height: 40px;
                        width: 180px;

                        &:hover {
                            border-bottom: 4px solid #ff0;
                        }
                    }
                }
            }

            section {
                background-color: #0d522b;
                width: 885px;
                margin: 0 auto;
                min-height: 208px;
                padding: 1rem;

                div.box {
                    background: url(imgs/spriteweb.png);
                    background-position: -475px 594px;
                    border: 4px solid #fff;
                    display: inline-block;
                    height: 200px;
                    width: 284px;
                }

            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <figure class="logo"></figure>
            <menu>
                <a href="">Inicio</a>
                <a href="">Nosotros</a>
                <a href="">Portafolio</a>
                <a href="">Servicios</a>
                <a href="">Contacto</a>
            </menu>
        </header>
        <section>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </section>
    </main>
</body>

</html>
