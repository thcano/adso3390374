<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22 - Cursors</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            div {
                background-color: #0003;
                border: 2px solid #fff3;
                margin: 1rem auto;
                height: 140px;
                width: 320px;
                &.cursor-move {
                    cursor: move;
                }
                &.cursor-help {
                    cursor: help;
                }
                &.cursor-crosshair {
                    cursor: crosshair;
                }
                &.cursor-image {
                    cursor: url(imgs/pointer.png), pointer;
                }
            }
        }
    </style>
</head>

<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>22 - Cursors</h1>
            <h3>Specifies the mouse cursor to be displayed when pointing over an element.</h3>
        </header>
        <section>
            <h4>Move:</h4>
            <div class="cursor-move"></div>
            <h4>Help:</h4>
            <div class="cursor-help"></div>
            <h4>Crosshair</h4>
            <div class="cursor-crosshair"></div>
            <h4>Image (Custom)</h4>
            <div class="cursor-image"></div>
        </section>
    </main>
</body>

</html>
