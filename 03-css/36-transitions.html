<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36 - Transitions</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            img {
                display: block;
                margin: 2rem auto;

                &.transition01 {
                    transition: transform 0.4s ease-in;

                    &:hover {
                        transform: scale(1.3);
                    }
                }

                &.transition02 {
                    transition: transform 0.6s ease-out;

                    &:hover {
                        transform: rotate(-0.5turn);
                    }
                }

                &.transition03 {
                    transition: transform 1s ease-in-out;

                    &:hover {
                        transform: RotateY(180deg);
                    }
                }

                &.transition04 {
                    transition: transform 0.8s ease;

                    &:hover {
                        transform: translateX(80px);
                    }
                }
            }

            div.box {
                background-color: #663399;
                height: 120px;
                margin: 0 auto;
                transition:
                    width 0.4s ease,
                    height 0.4s 0.4s ease,
                    transform 0.8s 0.8s ease,
                    background 0.4s 1.2s ease;
                width: 120px;

                &:hover {
                    background: #ffb429;
                    transform: rotate(360deg);
                    height: 200px;
                    width: 200px;
                }
            }
        }
    </style>
</head>

<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>
    <main>
        <header class="mainmenu ">
            <h1>36-transitions</h1>
            <h4>Enable you to define the transition between two states of an element.</h4>
        </header>

        <section>
            <h4>Scale(1.3):</h4>
            <img class="transition01" src="imgs/dk.png" alt="DK">
            <h4>Rotate(-0.5turn):</h4>
            <img class="transition02" src="imgs/dk.png" alt="DK">
            <h4>RotateY(180deg):</h4>
            <img class="transition03" src="imgs/dk.png" alt="DK">
            <h4>TranslateX(80px):</h4>
            <img class="transition04" src="imgs/dk.png" alt="DK">
            <h4>Multiple:</h4>
            <div class="box"></div>

        </section>

    </main>
</body>

</html>
