<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>30 - Text Shadow</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        section {
            p.txt {
                font-size: 2rem;
                margin-block: 4rem;
                text-align: center;

                &.txt1 {
                    color: white;
                    text-shadow: 0 0 12px yellowgreen;
                }

                &.txt2 {
                    color: white;
                    text-shadow: -4px -4px 10px yellowgreen;
                }

                &.txt3 {
                    font-size: 100px;
                    color: white;
                    text-shadow: 0 1px 0 hsl(174, 5%, 80%),
                        0 2px 0 hsl(174, 5%, 75%),
                        0 3px 0 hsl(174, 5%, 70%),
                        0 4px 0 hsl(174, 5%, 66%),
                        0 5px 0 hsl(174, 5%, 64%),
                        0 6px 0 hsl(174, 5%, 62%),
                        0 7px 0 hsl(174, 5%, 61%),
                        0 8px 0 hsl(174, 5%, 60%),

                        0 0 5px rgba(0, 0, 0, .05),
                        0 1px 3px rgba(0, 0, 0, .2),
                        0 3px 5px rgba(0, 0, 0, .2),
                        0 5px 10px rgba(0, 0, 0, .2),
                        0 10px 10px rgba(0, 0, 0, .2),
                        0 20px 20px rgba(0, 0, 0, .3);
                }

                &.txt4 {
                    color: 000;
                    font-family: 'Arial Black', sans-serif;
                    text-shadow:
                        0.25rem -0.25rem rgba(255, 0, 255, 0.75),
                        -0.25rem -0.25rem rgba(0, 255, 255, 0.75),
                        0 0.5rem rgba(255, 255, 0, 0.75);
                }
            }
        }
    </style>
</head>

<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>30 - Text Shadow</h1>
            <h3>Property that adds shadow effects directly to text content, taking values for offset, blur radius, and
                color.</h3>
        </header>
        <section>
            <p class="txt txt1">ADSO</p>
            <p class="txt txt2">C.P.I.C</p>
            <p class="txt txt3">SENA</p>
            <p class="txt txt4">Caldas</p>
        </section>
    </main>
</body>

</html>
