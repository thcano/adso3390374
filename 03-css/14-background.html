<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14 - Background</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        div.box {
            border: 2px solid #fff9;
            border-radius: 4px;
            height: 300px;

            &.box1 {
                background-color: darkviolet;
            }

            &.box2 {
                background-image: url(imgs/mario.png);
                background-size: 76px;
            }

            &.box3 {
                background-image: url(imgs/mario.png);
                background-size: 76px;
                background-repeat: repeat-x;
            }

            &.box4 {
                background-image: url(imgs/mario.png);
                background-size: 76px;
                background-repeat: no-repeat;
                background-position: center center;
            }

            &.box5 {
                background-image: url(imgs/mario.png);
                background-size: 76px;
                background-repeat: no-repeat;
                background-position: center center;
                background-size: contain;
                /* cover es usado para imagenes muy anchas, contain las ajusta a lo largo */
                /* Shorthand para ahorrar todo el código anterior*/
                /* background: url(imgs/mario.png) no-repeat center right /contain; */
            }

            &.box6 {
                background-image: url(imgs/mario.png);
                background-size: 46px;
                background-attachment: fixed;
                margin-bottom: 10rem;
            }
        }
    </style>
</head>

<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">

                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>14 - Background</h1>
            <ul>
                <li>background-color</li>
                <li>background-image</li>
                <li>background-repeat</li>
                <li>background-position</li>
                <li>background-size</li>
                <li>background-attachment</li>
            </ul>
        </header>
        <section>
            <h4>Background Color</h4>
            <div class="box box1"></div>
            <h4>Background Image</h4>
            <div class="box box2"></div>
            <h4>Background Repeat</h4>
            <div class="box box3"></div>
            <h4>Background Position</h4>
            <div class="box box4"></div>
            <h4>Background Size</h4>
            <div class="box box5"></div>
            <h4>Background Attachment</h4>
            <div class="box box6"></div>
        </section>
    </main>
</body>

</html>
