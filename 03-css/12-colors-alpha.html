<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12 - Colors Alpha</title>
    <link rel="stylesheet" href="../src/css/master.css">
    <style>
        div.mario {
            background: url(imgs/mario.png) no-repeat center;
            background-size: cover;
            width: 320px;
            margin: 0 auto;
            height: 440px;

            div {
                height: calc(440px/3);
                border-bottom: 4px solid #0009;
                overflow: hidden;
                transform: rotate(7deg);

                & :last-of-type {
                    border-bottom: none;
                }

                &.box1 {background-color: rgba(255, 255, 255, 0.8);}
                &.box2 {background-color: hsla(0, 0%, 100%, 0.6);}
                &.box3 {background-color: #fff6;}
            }
        }
    </style>
</head>

<body class="css">
    <a href="index.html" class="btn-home">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256">
            <path
                d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
            </path>
        </svg>
    </a>
    <main>
        <header class="mainmenu">
            <h1>12 - Colors Alpha</h1>
            <h3>The fourth alpha channel allows you to apply opacity or transparency to the color.</h3>
        </header>
        <section>
            <div class="mario">
                <div class="box1"></div>
                <div class="box2"></div>
                <div class="box3"></div>
            </div>
        </section>
    </main>
</body>

</html>
